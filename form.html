<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale-1.0">
        <title>Form instruction</title>
    </head>
    <body>
       <h1> dogs information</h1>
       <p> every table from a "table" element should be included in the form.
        every row from "tr"<br>
        every cell data from "td".
        <h4> 一列</h4>
        <table border="1">
            <tr>
                <td>100</td>
            </tr>
        </table>
        <h4>一行三列</h4>
        <table border="1"> 
            <tr>
                <td>dog one </td>
                <td>dog two </td>
                <td>dog three </td>
            </tr>

        </table>

        <h4>两行三列</h4>
        <caption >Dog Activities</caption>
        <table border="">
            <thead>
                <tr>
                    <th>Action</th>
                    <th>Dog</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>walking dog</td>
                    <td>running dog</td>
                    <td>grooming dog</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td>fetching ball</td>
                    <td>playing with dog</td>
                    <td>feeding dog</td>
                </tr>
            </tfoot>
        </table>


       </p>
    </body>
</html>
