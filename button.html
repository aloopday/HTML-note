<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Button Javascript event</title>
    </head>
    <body>
        <p id="dog-washing">This is a first-level dog washing service</p>
        <script>
            function dogWash(){

             x = document.getElementById("dog-washing")// find element
                x.style.color= "red"; //change color
            }
           
        </script>
        <button type="button" onclick="dogWash()"> click me </button><br>
