<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cross Row Form</title>
    </head>
    <body>
        <h1> instruction of cross columns & rows</h1>

        <caption> dogs owner information</caption>
        <table border="1">
            <tr>
                <th>Owner Name</th>
                <th colspan="2">Dogs number </th>
              
            </tr>
            <tr>
                <td>charles</td>
                <td>lala</td>
                <td>pappa</td>
            </tr>
        </table>
        <h1>Customer Contact Form</h1>
        <caption> customer contact form</caption>
        <table border="1">
           <tr>
            <th>name</th>
            <td>charles</td>
            
           </tr>
           <tr>
            <th rowspan="2">telephone</th>
            <td>123-456-7890</td>
    
           </tr>
           <tr>
            <td>987-654-3210</td>
           </tr>
            
        </table>
    </body>
</html>
