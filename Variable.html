<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Variable Element Example</title>
  <style>
    var {
      font-style: italic; /* Default browser style, can be customized */
      color: #17e0e0; /* Optional styling for emphasis */
    }
  </style>
</head>
<body>
  <h1>Using Variables in Programming</h1>
  <p>In Python, to calculate the square of a number <var>x</var>, you can write:</p>
  <pre><code>
<var>result</var> = <var>x</var> ** 2
print(<var>result</var>)
  </code></pre>
  <p>For example, if <var>x</var> = 5, the output is 25.</p>
</body>
</html>
